version: "3.8"

services:
  # ── Kafka (KRaft 모드 - Zookeeper 없이 단독 실행) ──
  kafka:
    image: apache/kafka:latest
    container_name: kafka-06
    ports:
      - "29092:29092"     # 호스트에서 접근용
    environment:
      # KRaft 모드 설정
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # 리스너 설정
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # ── "orders" 토픽 자동 생성 시 기본 파티션 수 ──
      KAFKA_NUM_PARTITIONS: 3

      # 단일 브로커이므로 replication-factor=1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      # Kafka가 준비되었는지 확인
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1
      interval: 5s
      timeout: 10s
      retries: 10

  # ── Kafka UI - 브로커/토픽/메시지 모니터링 ──
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-serialization
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # ── FastAPI 애플리케이션 ──
  app:
    build: .
    container_name: app-serialization
    ports:
      - "8000:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - USER_EVENTS_TOPIC=user-events
      - ORDER_EVENTS_TOPIC=order-events
      - CONSUMER_GROUP_ID=serialization-demo-group
    depends_on:
      kafka:
        condition: service_healthy