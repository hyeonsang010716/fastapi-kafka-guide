version: "3.8"

services:
  # =============================================================
  # Kafka (KRaft 모드 - Zookeeper 없이 단독 실행)
  # =============================================================
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      # Kafka가 준비되었는지 확인
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1
      interval: 5s
      timeout: 10s
      retries: 10

  # =============================================================
  # Kafka UI - 토픽과 메시지를 웹에서 확인
  # =============================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-order-system
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=order-system
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # =============================================================
  # 주문 서비스 (Order Service) - 포트 8000
  # =============================================================
  order-service:
    build:
      context: ./order-service
    container_name: order-service
    ports:
      - "8000:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SERVICE_PORT=8000
    volumes:
      # shared 디렉토리를 볼륨 마운트하여 공유 이벤트 모델 사용
      - ./shared:/app/shared
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure

  # =============================================================
  # 결제 서비스 (Payment Service) - 포트 8001
  # =============================================================
  payment-service:
    build:
      context: ./payment-service
    container_name: payment-service
    ports:
      - "8001:8001"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SERVICE_PORT=8001
    volumes:
      - ./shared:/app/shared
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure

  # =============================================================
  # 재고 서비스 (Inventory Service) - 포트 8002
  # =============================================================
  inventory-service:
    build:
      context: ./inventory-service
    container_name: inventory-service
    ports:
      - "8002:8002"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SERVICE_PORT=8002
    volumes:
      - ./shared:/app/shared
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure